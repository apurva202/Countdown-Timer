<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Countdown Timer</title>
</head>

<body>
    <div class="timer">
        <div class="hour timeunit" contenteditable="true" inputmode="numeric">00</div>
        <span>:</span>
        <div class="minute timeunit" contenteditable="true" inputmode="numeric">00</div>
        <span>:</span>
        <div class="second timeunit" contenteditable="true" inputmode="numeric">00</div>
    </div>


    <div class="controls">
        <button class="btn start" onclick="start()">Start</button>
        <button class="btn stop" style="display: none;" onclick="stop()">Stop</button>
        <button class="btn reset" style="display: none;" onclick="reset()">Reset</button>
    </div>

    <script src="./script.js"></script>
</body>

</html>
